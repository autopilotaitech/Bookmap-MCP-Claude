<!doctype html>
<html><head><meta charset="utf-8"><title>Pax AI</title>
<style>
  :root {
    --bg-0: #07090d;
    --bg-1: #0b0f17;
    --bg-2: #11161f;
    --bg-3: #161c27;
    --line: rgba(255,255,255,0.045);
    --line-2: rgba(255,255,255,0.08);
    --text: #d8e3f0;
    --text-dim: #7c8a9c;
    --text-faint: #4d5868;
    --cyan: #36d6ff;
    --orange: #ff9b3c;
    --green: #4ade80;
    --red: #ff5a6a;
    --yellow: #f1c54a;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; width:100%;
    background: var(--bg-0); color: var(--text);
    font-family: 'Inter', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
    font-size: 13px; line-height: 1.42;
    -webkit-user-select: none; user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .root {
    /* rows: titlebar, strip, agentbar, agent-last, body(fills), input/footer */
    display: grid; grid-template-rows: 30px 36px auto auto 1fr; height: 100vh;
    background:
      radial-gradient(120% 80% at 50% 0%, #131a25 0%, #0a0e15 55%, var(--bg-0) 100%);
    border: 1px solid rgba(54,214,255,0.10);
    box-shadow: 0 14px 50px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.04) inset;
    min-height: 0;
  }
  /* Body becomes a flex column with sticky drawer headers at top and the
     transcript expanding to fill whatever vertical space is left. Each
     drawer's body slides open/closed via max-height transition. */
  .body { display: flex; flex-direction: column; min-height: 0;
    padding: 8px 10px; overflow: hidden;
    scrollbar-width: thin; scrollbar-color: #2a3242 transparent; }
  .body > .whynow-area { flex: 0 0 auto; }
  .body > .drawer { flex: 0 0 auto; margin-top: 4px; }
  .body > .transcript-wrap { flex: 1 1 auto; min-height: 0;
    overflow-y: auto; margin-top: 8px;
    scrollbar-width: thin; scrollbar-color: #2a3242 transparent; }
  .body > .transcript-wrap::-webkit-scrollbar { width: 6px; }
  .body > .transcript-wrap::-webkit-scrollbar-thumb { background: #1f2735; border-radius: 3px; }
  /* —— Drawer (slide-down) —— */
  .drawer { border: 1px solid var(--line-2); border-radius: 6px;
    background: var(--bg-1); overflow: hidden; }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px 5px 10px;
    cursor: pointer; user-select: none;
    background: linear-gradient(180deg, rgba(54,214,255,0.04), transparent);
  }
  .drawer-head .ttl { font-size: 10px; letter-spacing: 0.8px;
    color: var(--text-dim); text-transform: uppercase; font-weight: 700; }
  .drawer-head .chev { color: var(--text-faint); font-size: 11px;
    transition: transform 0.18s ease; line-height: 1; }
  .drawer.open .drawer-head .chev { transform: rotate(180deg); color: var(--cyan); }
  .drawer-body {
    max-height: 0; overflow: hidden;
    transition: max-height 0.22s ease;
    border-top: 1px solid var(--line);
    border-top-color: transparent;
  }
  .drawer.open .drawer-body {
    max-height: 320px;
    overflow-y: auto;
    border-top-color: var(--line);
  }
  .drawer-body::-webkit-scrollbar { width: 5px; }
  .drawer-body::-webkit-scrollbar-thumb { background: #1f2735; border-radius: 3px; }
  .drawer-body .inner { padding: 8px 10px; }
  .drawer.cyan { border-color: rgba(54,214,255,0.18); }
  .drawer.cyan .drawer-head { background: linear-gradient(180deg, rgba(54,214,255,0.08), rgba(54,214,255,0.01)); }
  .drawer.cyan .drawer-head .ttl { color: var(--cyan); }
  .titlebar {
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 8px 0 12px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(54,214,255,0.04), transparent);
  }
  .titlebar .brand { font-size: 11px; letter-spacing: 1.4px;
    color: var(--text-dim); font-weight: 600; }
  .titlebar .brand b { color: var(--cyan); font-weight: 700; }
  .titlebar .ctrls { display:flex; gap:6px; }
  .titlebar .dot { width:11px; height:11px; border-radius:50%;
    background: var(--bg-3); border: 1px solid var(--line-2); cursor:pointer; }
  .titlebar .dot:hover { filter: brightness(1.4); }
  .titlebar .dot.x { background:#3a1820; border-color: rgba(255,90,106,0.4); }
  .titlebar .dot.x:hover { background:#ff5a6a; }
  .strip {
    display:grid; grid-template-columns: auto 1fr auto;
    align-items:center; gap: 10px;
    padding: 0 12px;
    background: var(--bg-1);
    border-bottom: 1px solid var(--line);
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 11.5px;
  }
  .strip #sym { color: var(--text); font-weight: 600; }
  .strip #mid { color: var(--cyan); font-variant-numeric: tabular-nums;
    font-weight: 600; }
  .strip #nearest { color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .strip #nearest b { color: var(--text); font-weight: 600; }
  .strip #conv { color: var(--text-faint); font-size: 10.5px; text-align:right;}
  .strip #conv .pos { color: var(--green); }
  .strip #conv .neg { color: var(--red); }
  .strip .offline { color: var(--red); }
  .strip .stale { color: var(--yellow); }
  /* —— WHY NOW chips —— */
  .whynow { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
  .chip {
    display: grid; grid-template-columns: auto 1fr auto; gap: 8px;
    align-items: center;
    padding: 6px 9px 6px 8px;
    border-radius: 6px;
    font-size: 11px; line-height: 1.35;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.12s ease;
  }
  .chip .ask {
    width: 22px; height: 22px; border-radius: 5px;
    display:flex; align-items:center; justify-content:center;
    background: rgba(54,214,255,0.10); border: 1px solid rgba(54,214,255,0.30);
    color: var(--cyan); cursor: pointer; font-size: 12px;
    transition: all 0.12s ease;
  }
  .chip .ask:hover { background: rgba(54,214,255,0.22); transform: translateX(1px); }
  .chip.MED .ask  { background: rgba(255,155,60,0.10); border-color: rgba(255,155,60,0.30); color: var(--orange); }
  .chip.MED .ask:hover { background: rgba(255,155,60,0.22); }
  .chip.LOW .ask  { background: rgba(255,255,255,0.04); border-color: var(--line-2); color: var(--text-dim); }
  .chip.LOW .ask:hover { background: rgba(255,255,255,0.08); color: var(--text); }
  .chip:hover { transform: translateX(2px); box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
  .chip .sev {
    width: 32px; text-align: center; font-size: 9px; font-weight: 700;
    letter-spacing: 0.6px; padding: 1px 0; border-radius: 3px;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
  }
  .chip .body-txt { color: var(--text); }
  .chip .kind { display: block; font-size: 9.5px; letter-spacing: 0.6px;
    color: var(--text-faint); font-family: 'JetBrains Mono', monospace; }
  .chip .headline { display: block; color: var(--text); }
  .chip .details {
    display: none; margin-top: 4px; padding-top: 4px;
    border-top: 1px solid rgba(255,255,255,0.05);
    color: var(--text-dim); font-size: 10.5px;
  }
  .chip.open .details { display: block; }
  .chip.HIGH {
    background: linear-gradient(180deg, rgba(54,214,255,0.10), rgba(54,214,255,0.02));
    border: 1px solid rgba(54,214,255,0.32);
  }
  .chip.HIGH .sev { background: rgba(54,214,255,0.20); color: var(--cyan); }
  .chip.MED {
    background: linear-gradient(180deg, rgba(255,155,60,0.08), rgba(255,155,60,0.02));
    border: 1px solid rgba(255,155,60,0.28);
  }
  .chip.MED .sev { background: rgba(255,155,60,0.18); color: var(--orange); }
  .chip.LOW {
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--line-2);
  }
  .chip.LOW .sev { background: rgba(255,255,255,0.05); color: var(--text-dim); }
  .edge-card {
    font-size: 11.5px;
  }
  .edge-grid { display: grid; grid-template-columns: 1fr 1fr;
    gap: 3px 12px; font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 10.5px; }
  .edge-grid .k { color: var(--text-faint); }
  .edge-grid .v { color: var(--text); font-variant-numeric: tabular-nums;
    text-align: right; }
  .edge-card .reasons { margin-top: 6px; padding-top: 5px;
    border-top: 1px solid rgba(255,255,255,0.04);
    color: var(--text-dim); font-size: 10.5px; line-height: 1.45; }
  .edge-card .reasons li { margin-left: 14px; }
  .playbook {
    font-size: 11.5px;
  }
  .playbook .state { color: var(--cyan); font-weight: 600;
    font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 11px; }
  .playbook .branch { padding: 4px 0;
    border-top: 1px dashed rgba(255,255,255,0.04); }
  .playbook .branch:first-of-type { border-top: 0; }
  .playbook .branch .nm { color: var(--text); font-weight: 600; font-size: 11px;}
  .playbook .branch .iff { color: var(--text-dim); font-size: 10.5px; }
  .playbook .branch .ths { color: var(--cyan); font-size: 10.5px; }
  /* —— transcript —— */
  .transcript { margin-top: 6px; }
  .turn { padding: 6px 0; border-top: 1px solid var(--line); }
  .turn:first-child { border-top: 0; }
  .turn .who { font-size: 10px; letter-spacing: 0.8px; text-transform: uppercase;
    margin-bottom: 2px; }
  .turn .who.you { color: var(--text-faint); }
  .turn .who.you b { color: var(--text-dim); }
  .turn .who.pax { color: var(--text-faint); }
  .turn .who.pax b { color: var(--cyan); }
  .turn .msg { color: var(--text); font-size: 12.5px; line-height: 1.45;
    white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
  .turn.pax .msg em { color: var(--text-dim); font-style: normal; }
  .turn.pax.streaming .msg::after { content: '\258F';
    color: var(--cyan); opacity: 0.7; margin-left: 2px;
    animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .turn .meta { font-size: 9.5px; color: var(--text-faint);
    font-family: 'JetBrains Mono', 'Consolas', monospace; margin-top: 3px; }
  .turn.error .msg { color: var(--red); font-size: 11px; }
  /* —— /deep marker (Phase 2) —— */
  .turn .deep-tag { color: var(--cyan); letter-spacing: 0.6px;
    font-size: 9.5px; font-weight: 700; }
  .turn.deep.pax .msg { border-left: 2px solid rgba(54,214,255,0.30);
    padding-left: 8px; }
  /* —— history —— */
  .turn.historical { opacity: 0.55; }
  .turn.historical .who::after { content: ' \B7 history'; color: var(--text-faint);
    font-size: 9.5px; letter-spacing: 0.4px; }
  .hist-divider { font-size: 9.5px; color: var(--text-faint);
    letter-spacing: 0.8px; padding: 6px 0 4px;
    border-top: 1px dashed var(--line-2); margin-top: 6px;
    text-transform: uppercase; text-align: center; }
  .toast { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(54,214,255,0.16); border: 1px solid rgba(54,214,255,0.4);
    color: var(--cyan); padding: 5px 10px; border-radius: 6px;
    font-size: 11px; letter-spacing: 0.5px;
    opacity: 0; transition: opacity 0.2s ease;
    pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; }
  /* —— cost / latency footer (Phase 1) —— */
  .cost-footer[hidden] { display: none; }
  .cost-footer {
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 9.5px; letter-spacing: 0.4px;
    color: var(--text-faint); text-align: right;
    padding: 2px 12px 4px; background: var(--bg-1);
    border-top: 1px dashed var(--line-2);
  }
  .cost-footer .turns { color: var(--text-dim); }
  .cost-footer .usd   { color: var(--cyan); }
  .cost-footer .toks  { color: var(--text-dim); }
  .cost-footer .lat   { color: var(--text-faint); }
  .cost-footer .sub   { color: var(--text-faint); font-style: italic; }
  /* —— input —— */
  .input {
    display: grid; grid-template-columns: 1fr auto auto;
    align-items: center; gap: 6px;
    padding: 6px 8px 8px;
    border-top: 1px solid var(--line); background: var(--bg-1);
  }
  .input textarea {
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--line-2); border-radius: 8px;
    padding: 7px 10px; font: inherit; font-size: 13px;
    resize: none; height: 30px; line-height: 1.3;
    outline: none; transition: border-color .12s ease;
    -webkit-user-select: text; user-select: text;
  }
  .input textarea::placeholder { color: var(--text-faint); }
  .input textarea:focus { border-color: rgba(54,214,255,0.45); }
  .input textarea:disabled { color: var(--text-faint); cursor: not-allowed; }
  .icon-btn {
    width: 30px; height: 30px; background: var(--bg-2);
    border: 1px solid var(--line-2); border-radius: 8px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim); cursor: pointer;
    transition: all .12s ease;
  }
  .icon-btn:hover { color: var(--cyan); border-color: rgba(54,214,255,0.4); }
  .icon-btn:disabled, .icon-btn.disabled { cursor: not-allowed; opacity: 0.4; }
  .icon-btn.send { color: var(--cyan); border-color: rgba(54,214,255,0.3);
    background: linear-gradient(180deg, rgba(54,214,255,0.10), rgba(54,214,255,0.04)); }
  .icon-btn.send:hover { background: rgba(54,214,255,0.18); }
  .icon-btn.mic.listening { color: var(--red); border-color: rgba(255,90,106,0.4);
    background: rgba(255,90,106,0.10);
    animation: pulse 1s infinite; }
  /* —— abort button (Phase 3) —— */
  .icon-btn.abort { color: var(--red); border-color: rgba(255,90,106,0.4);
    background: linear-gradient(180deg, rgba(255,90,106,0.18), rgba(255,90,106,0.06));
    display: none; }
  .icon-btn.abort:hover { background: rgba(255,90,106,0.30); color: #fff; }
  body.in-flight .icon-btn.send  { display: none; }
  body.in-flight .icon-btn.abort { display: flex; }
  /* —— regenerate button (Phase 3) —— */
  .turn .regen-btn {
    display: none; position: absolute; right: 4px; bottom: 4px;
    background: rgba(54,214,255,0.10);
    border: 1px solid rgba(54,214,255,0.30);
    color: var(--cyan); border-radius: 5px;
    width: 20px; height: 20px;
    align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer;
    transition: all 0.12s ease;
  }
  .turn .regen-btn:hover { background: rgba(54,214,255,0.22); }
  .turn.pax { position: relative; padding-bottom: 4px; }
  .turn.pax.last-completed .regen-btn { display: flex; }
  @keyframes pulse { 50% { background: rgba(255,90,106,0.25); } }
  svg { width: 14px; height: 14px; }
</style></head>
<body>
  <div class="root">
    <div class="titlebar">
      <div class="brand"><b>PAX</b> AI</div>
      <div class="ctrls">
        <div class="dot" title="minimize"></div>
        <div class="dot x" title="close" onclick="closePaxAi()"></div>
      </div>
    </div>

    <div class="strip">
      <div><span id="sym">--</span> <span id="mid">-</span></div>
      <div id="nearest">--</div>
      <div id="conv">--</div>
    </div>

    <style>
      .agentbar{display:flex;align-items:center;justify-content:space-between;
        gap:8px;padding:5px 10px;border-bottom:1px solid #1c2230;
        background:#0c1018;font-size:11px}
      .agentbar .st{display:flex;align-items:center;gap:6px;color:#9fb0c8}
      .agentbar .adot{width:8px;height:8px;border-radius:50%;background:#445}
      .agentbar .adot.on{background:#39d98a}
      .agentbar .adot.armed{background:#ff5d5d;box-shadow:0 0 6px #ff5d5d}
      .agentbar button{background:#162033;color:#cfe0f5;border:1px solid #28344a;
        border-radius:5px;padding:3px 9px;font-size:11px;cursor:pointer}
      .agentbar button:hover{background:#1d2942}
      .agentbar button.armed{background:#3a1414;border-color:#7a2a2a;color:#ffb3b3}
      .agentlast{padding:4px 10px;font-size:11px;color:#7d8aa0;
        border-bottom:1px solid #141a26;min-height:14px;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis}
      .tick{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
        line-height:1.5;padding:1px 10px;white-space:pre-wrap;color:#8fa1bb;
        border-left:2px solid #222b3a}
      .tick.tk-long{color:#39d98a;border-left-color:#2a7a55}
      .tick.tk-short{color:#ff6b6b;border-left-color:#7a2a2a}
      .tick.tk-wait{color:#6f7c92;border-left-color:#222b3a}
      .tick.tk-act{color:#cfe0f5;border-left-color:#3a4a66}
      .tick.tk-err{color:#ffb35c;border-left-color:#7a5a2a}
    </style>
    <div class="agentbar" id="agentbar">
      <div class="st"><span class="adot" id="agent-dot"></span>
        <span id="agent-label">AGENT off</span></div>
      <div>
        <button id="agent-toggle" onclick="agentToggle()">Start</button>
        <button id="agent-arm" onclick="agentArm()"
                title="Observe = think + log only. Armed = place SIM orders (never live).">Observe</button>
      </div>
    </div>
    <div class="agentlast" id="agent-last">agent idle</div>

    <div class="body" id="body">

      <div class="transcript-wrap">
        <div class="transcript" id="transcript"></div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <div class="cost-footer" id="cost-footer" hidden></div>

    <div id="attach-chip" style="display:none;align-items:center;gap:8px;padding:5px 12px;
      border-top:1px solid var(--line);background:var(--bg-1);font-size:11px;color:var(--text-dim)">
      <img id="attach-thumb" alt="" style="height:34px;width:34px;object-fit:cover;border-radius:5px;border:1px solid var(--line-2)">
      <span id="attach-name">image attached</span>
      <span onclick="clearPendingImage()" title="remove"
        style="cursor:pointer;color:var(--red);margin-left:auto;font-weight:700">&times;</span>
    </div>
    <div class="input">
      <textarea id="chat-input" placeholder="ask, attach an image, or tap the mic..." rows="1"></textarea>
      <input type="file" id="attach-input" accept="image/*" style="display:none">
      <button class="icon-btn attach" id="attach-btn" title="attach image"
              onclick="document.getElementById('attach-input').click()">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M9.5 2.5a3 3 0 0 0-3 3v6a1.5 1.5 0 0 0 3 0V6a.5.5 0 0 0-1 0v5.5a.5.5 0 0 1-1 0v-6a2 2 0 1 1 4 0v6a3.5 3.5 0 0 1-7 0V5a.5.5 0 0 1 1 0v6.5a2.5 2.5 0 0 0 5 0v-6a3 3 0 0 0-3-3z"/>
        </svg>
      </button>
      <button class="icon-btn mic" id="mic-btn" title="voice (Web Speech API)"
              onclick="toggleMic()">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 1.5a2 2 0 0 0-2 2v5a2 2 0 1 0 4 0v-5a2 2 0 0 0-2-2zM4 7.5a.5.5 0 0 0-1 0 5 5 0 0 0 4.5 4.975V14H6a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1H8.5v-1.525A5 5 0 0 0 13 7.5a.5.5 0 0 0-1 0 4 4 0 1 1-8 0z"/>
        </svg>
      </button>
      <button class="icon-btn send" id="send-btn" title="send (Enter)"
              onclick="sendChat()">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M1.5 1.5l13 6.5-13 6.5 2.5-6.5-2.5-6.5z"/>
        </svg>
      </button>
      <button class="icon-btn abort" id="abort-btn" title="abort (Esc)"
              onclick="abortChat()">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <rect x="3.5" y="3.5" width="9" height="9" rx="1"/>
        </svg>
      </button>
    </div>
  </div>

<script>
// ---------- ui helpers ----------
function closePaxAi() {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.close) {
    window.pywebview.api.close();
  }
}
function toggleDrawer(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('open');
}
function fmtP(p) {
  if (p == null) return '--';
  return (p >= 0 ? '+' : '') + Number(p).toFixed(2) + 'p';
}
function decisionGlyph(d) {
  if (!d) return '';
  if (d.includes('FOLLOW') && d.includes('LONG'))  return ' FOLLOW ▲';
  if (d.includes('FOLLOW') && d.includes('SHORT')) return ' FOLLOW ▼';
  if (d.includes('FADE')   && d.includes('LONG'))  return ' FADE ▲';
  if (d.includes('FADE')   && d.includes('SHORT')) return ' FADE ▼';
  return '';
}
function nowHHMMSS() {
  const d = new Date();
  return d.toTimeString().slice(0,8);
}

// HTML-escape any value before concatenating it into innerHTML. ALL
// snapshot / API fields are treated as untrusted text -- the dashboard
// might publish a label or decision string sourced from an external
// system, and we never want raw markup to slip into the DOM through
// the chat UI. (Audit fix 7.)
function _esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ---------- cost / latency footer (Phase 1) ----------
// Cumulative session counters. Reset only on page reload (which happens
// when the user disables + re-enables the Pax AI addon). The CLI's
// `total_cost_usd` field is authoritative -- we never compute pricing
// client-side. When the CLI omits cost (subscription-mode on some
// versions) we display "subscription" rather than $0.
const _costState = {
  turns:           0,
  costUsd:         0,
  costSeen:        false,   // true once any done event carried a cost
  totalTokens:     0,
  lastLatencyMs:   0,
};
function updateCostFooter(done) {
  _costState.turns += 1;
  _costState.lastLatencyMs = (done && typeof done.elapsed_ms === 'number')
    ? done.elapsed_ms : 0;
  if (done && typeof done.total_cost_usd === 'number') {
    _costState.costUsd += done.total_cost_usd;
    _costState.costSeen = true;
  }
  // Sum visible-token-ish fields when present. input + output dominate;
  // cache_read is also charged (at a discount) so we include it.
  let turnTokens = 0;
  for (const k of ['input_tokens', 'output_tokens',
                     'cache_creation_input_tokens',
                     'cache_read_input_tokens']) {
    if (done && typeof done[k] === 'number') turnTokens += done[k];
  }
  _costState.totalTokens += turnTokens;

  const footer = document.getElementById('cost-footer');
  if (!footer) return;
  // Render via textContent on a fresh span graph -- no innerHTML so
  // there's no XSS vector even if a future field becomes user-shaped.
  while (footer.firstChild) footer.removeChild(footer.firstChild);
  const turnsSpan = document.createElement('span');
  turnsSpan.className = 'turns';
  turnsSpan.textContent = _costState.turns + ' turns';
  footer.appendChild(turnsSpan);
  footer.appendChild(document.createTextNode(' · '));
  const usdSpan = document.createElement('span');
  if (_costState.costSeen) {
    usdSpan.className = 'usd';
    usdSpan.textContent = '$' + _costState.costUsd.toFixed(4);
  } else {
    usdSpan.className = 'sub';
    usdSpan.textContent = 'subscription';
  }
  footer.appendChild(usdSpan);
  if (_costState.totalTokens > 0) {
    footer.appendChild(document.createTextNode(' · '));
    const tokSpan = document.createElement('span');
    tokSpan.className = 'toks';
    const k = Math.round(_costState.totalTokens / 100) / 10;
    tokSpan.textContent = '~' + k.toFixed(1) + 'k tok';
    footer.appendChild(tokSpan);
  }
  footer.appendChild(document.createTextNode(' · '));
  const latSpan = document.createElement('span');
  latSpan.className = 'lat';
  latSpan.textContent = 'last ' + (_costState.lastLatencyMs / 1000).toFixed(1) + 's';
  footer.appendChild(latSpan);
  footer.hidden = false;
}

// ---------- strip + edge + playbook polling ----------
async function pollContext() {
  try {
    const r = await fetch('/api/pax/context', {cache:'no-store'});
    const s = await r.json();
    const symEl  = document.getElementById('sym');
    const midEl  = document.getElementById('mid');
    const nEl    = document.getElementById('nearest');
    const cEl    = document.getElementById('conv');
    if (s.health !== 'ok') {
      symEl.textContent = 'BRIDGE';
      midEl.innerHTML = '<span class="offline">OFFLINE</span>';
      nEl.textContent = s.bridgeError || '';
      cEl.textContent = '';
      return null;
    }
    const alias = (s.alias || '').split('.')[0] || '--';
    symEl.textContent = alias;
    // mid is a number from JSON; .toFixed() is intrinsically safe. STALE
    // span is a fixed literal. No dynamic untrusted text in this branch,
    // but we still build via concatenation of safe pieces.
    let midHtml = s.mid != null ? Number(s.mid).toFixed(2) : '-';
    if (s.stale) midHtml += ' <span class="stale">STALE</span>';
    midEl.innerHTML = midHtml;
    if (s.nearest) {
      // s.nearest.label and s.nearest.decision come from the snapshot
      // and must be escaped before going into innerHTML.
      nEl.innerHTML = fmtP(s.nearest.distance) + ' to <b>' + _esc(s.nearest.label) +
        '</b><span style="color:var(--text-faint)">' +
        decisionGlyph(s.nearest.decision || '') + '</span>';
    } else { nEl.textContent = '--'; }
    const cs = s.conviction && s.conviction.score;
    const anchor = (s.session && s.session.anchorMode) ||
                    (s.conviction && s.conviction.anchorMode) || '--';
    if (cs == null) {
      // anchor is a snapshot string -> textContent (safer than innerHTML
      // when no markup is needed).
      cEl.textContent = anchor;
    } else {
      const cls = cs >= 0 ? 'pos' : 'neg';
      const sign = cs >= 0 ? '+' : '';
      cEl.innerHTML = 'conv <span class="' + cls + '">' + sign + cs.toFixed(2)
        + '</span> &middot; ' + _esc(anchor);
    }
    return s.nearest ? s.nearest.label : null;
  } catch (e) {
    document.getElementById('sym').textContent = 'PAX-AI';
    document.getElementById('mid').innerHTML = '<span class="offline">PROXY ERR</span>';
    return null;
  }
}

async function tick() {
  await pollContext();   // strip only; analysis drawers removed
}
tick();
setInterval(tick, 1000);

// ---------- agentic sim trader control ----------
let _agentState = {running:false, armed:false};
let _lastTickTs = 0;

// The actual scroll container is .transcript-wrap (overflow-y:auto), NOT
// #transcript (its non-scrolling child). Pin it to the bottom on every update.
function scrollBottom(){
  const w = document.querySelector('.transcript-wrap');
  if (w) w.scrollTop = w.scrollHeight;
}

// Stream each new agent cycle into the transcript like a terminal log.
function appendAgentTick(L, armed){
  const tr = document.getElementById('transcript'); if(!tr || !L) return;
  const hh = L.ts_ms ? new Date(L.ts_ms).toTimeString().slice(0,8) : '';
  const act = L.action || (L.error ? 'ERR' : '?');
  const why = L.rationale || L.reason || L.governor || L.error || '';
  const a = String(act);
  const cls = a.indexOf('LONG')>=0 ? 'tk-long' : a.indexOf('SHORT')>=0 ? 'tk-short'
    : (a==='WAIT'||a==='HOLD') ? 'tk-wait' : (a==='ERR') ? 'tk-err' : 'tk-act';
  const div = document.createElement('div');
  div.className = 'tick ' + cls;
  div.textContent = hh + '  ' + (armed ? '[ARMED] ' : '') + a + (why ? ('  ' + why) : '');
  tr.appendChild(div);
  scrollBottom();
}
function renderAgent(s){
  if(!s) return;
  _agentState = {running:!!s.running, armed:!!s.armed};
  const dot=document.getElementById('agent-dot');
  const lab=document.getElementById('agent-label');
  const tog=document.getElementById('agent-toggle');
  const arm=document.getElementById('agent-arm');
  if(!dot) return;
  dot.className = 'adot' + (s.running ? (s.armed ? ' armed' : ' on') : '');
  lab.textContent = s.error ? ('AGENT ' + s.error)
    : ('AGENT ' + (s.running ? (s.armed ? 'ARMED (sim)' : 'observing') : 'off')
       + (s.cycles!=null ? (' · ' + s.cycles + ' cycles') : ''));
  tog.textContent = s.running ? 'Stop' : 'Start';
  arm.textContent = s.armed ? 'Armed' : 'Observe';
  arm.className = s.armed ? 'armed' : '';
  const last=document.getElementById('agent-last'), L=s.last;
  if(L){
    const why = L.rationale || L.reason || L.governor || '';
    last.textContent = (L.action||'?') + (why ? ' — ' + why : '');
    if(L.ts_ms && L.ts_ms !== _lastTickTs){
      _lastTickTs = L.ts_ms;
      appendAgentTick(L, s.armed);   // new cycle -> terminal line
    }
  }
}
async function pollAgent(){
  try{ renderAgent(await (await fetch('/api/pax/agent/status')).json()); }catch(e){}
}
async function _agentPost(path, body){
  try{
    const r = await fetch(path, {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})});
    renderAgent(await r.json());
  }catch(e){}
}
// Generic terminal line (system/command echo), same look as agent ticks.
function appendTermLine(text, cls){
  const tr=document.getElementById('transcript'); if(!tr) return;
  const div=document.createElement('div');
  div.className='tick '+(cls||'tk-act');
  div.textContent=text;
  tr.appendChild(div);
  scrollBottom();
}
function agentToggle(){
  if(_agentState.running){
    appendTermLine('[STOP] agent stopped', 'tk-wait');
    _agentPost('/api/pax/agent/stop');
  } else {
    appendTermLine('[START] agent running ('+(_agentState.armed?'armed':'observe')+')', 'tk-act');
    _agentPost('/api/pax/agent/start', {armed:_agentState.armed});
  }
}
// Inline toggle, no browser confirm popup. Sim-only; arming just turns on
// paper-order execution (never live).
function agentArm(){
  const next = !_agentState.armed;
  appendTermLine(next ? '[ARMED] sim execution ON - placing paper orders'
                      : '[OBSERVE] sim execution OFF', next ? 'tk-short' : 'tk-wait');
  _agentPost('/api/pax/agent/arm', {armed:next});
}
pollAgent();
setInterval(pollAgent, 2000);

// ---------- chat ----------
let _streamingPaxBubble = null;   // currently-streaming Pax turn DOM
let _chatInFlight = false;

function appendTurn(kind, who, text, isStreaming, opts) {
  const t = document.getElementById('transcript');
  const div = document.createElement('div');
  div.className = 'turn ' + kind + (isStreaming ? ' streaming' : '');
  const whoEl = document.createElement('div');
  whoEl.className = 'who ' + (kind === 'pax' ? 'pax' : 'you');
  // Build the WHO line with textContent fragments so the only HTML
  // structure is the <b> we control. `who` is hard-coded by callers
  // ('YOU' / 'PAX'), but the deep marker is appended as a separate
  // styled span via DOM nodes -- no innerHTML.
  const whoB = document.createElement('b');
  whoB.textContent = who;
  whoEl.appendChild(whoB);
  whoEl.appendChild(document.createTextNode(' · ' + nowHHMMSS()));
  if (opts && opts.deep) {
    div.classList.add('deep');
    const deepTag = document.createElement('span');
    deepTag.className = 'deep-tag';
    deepTag.textContent = ' · DEEP';
    whoEl.appendChild(deepTag);
  }
  div.appendChild(whoEl);
  const msgEl = document.createElement('div');
  msgEl.className = 'msg';
  msgEl.dataset.rawText = text || '';
  msgEl.textContent = kind === 'pax' ? stripMachineBlocks(text || '') : (text || '');
  div.appendChild(msgEl);
  // Attached image thumbnail (YOU bubble). opts.image is a data: URL.
  if (opts && opts.image) {
    const im = document.createElement('img');
    im.src = opts.image;
    im.style.cssText = 'max-width:180px;max-height:140px;border-radius:6px;margin-top:6px;border:1px solid var(--line-2);display:block';
    div.appendChild(im);
  }
  // Phase 3 regenerate: each Pax bubble gets a ↻ button that surfaces
  // only when `.last-completed` is set (via CSS), wired up in the
  // _streamChatMessage finally branch.
  if (kind === 'pax') {
    const regen = document.createElement('button');
    regen.className = 'regen-btn';
    regen.type = 'button';
    regen.title = 'regenerate against current snapshot';
    regen.textContent = '↻';   // ↻
    div.appendChild(regen);
  }
  t.appendChild(div);
  scrollBottom();
  return div;
}

function appendMeta(parent, metaText) {
  const m = document.createElement('div');
  m.className = 'meta';
  m.textContent = metaText;
  parent.appendChild(m);
}

// Last-request snapshot, used by Phase 3 regenerate. Captured BEFORE
// the fetch so it survives any error path. Shape:
//   { message, deep, displayText }
let _lastRequest = null;

async function _streamChatMessage(request) {
  if (_chatInFlight) return;
  // Backwards-compat: accept either a plain string (legacy callers) or
  // a {message, deep, displayText, suppressUserEcho} request object.
  if (typeof request === 'string') request = {message: request};
  const msg = request && request.message;
  if (!msg) return;
  const deep = !!(request && request.deep);
  const image = (request && request.image) || null;   // {media_type,data,dataUrl}
  const displayText = (request && request.displayText) || msg;
  // suppressUserEcho is set by regenerateLastPax so the original YOU
  // bubble in the transcript is preserved and only the Pax response is
  // re-streamed. _lastRequest is still updated so the regenerate target
  // tracks the latest answer.
  const suppressUserEcho = !!(request && request.suppressUserEcho);
  _lastRequest = {message: msg, deep: deep, displayText: displayText};

  // Clear the "last-completed" marker on the prior Pax bubble (regenerate
  // is only ever offered on the most recent finished turn).
  for (const el of document.querySelectorAll('.turn.pax.last-completed')) {
    el.classList.remove('last-completed');
  }

  if (!suppressUserEcho) {
    appendTurn('you', 'YOU', displayText, false,
               {deep: deep, image: image && image.dataUrl});
  }
  _chatInFlight = true;
  document.body.classList.add('in-flight');
  document.getElementById('send-btn').classList.add('disabled');
  _streamingPaxBubble = appendTurn('pax', 'PAX', '', true, {deep: deep});
  const msgEl = _streamingPaxBubble.querySelector('.msg');

  try {
    const r = await fetch('/api/pax/chat/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(image
        ? {message: msg, deep: deep, image: {media_type: image.media_type, data: image.data}}
        : {message: msg, deep: deep}),
    });
    if (!r.ok || !r.body) {
      msgEl.textContent = 'request failed: ' + r.status;
      _streamingPaxBubble.classList.add('error');
      return;
    }
    const reader = r.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
        handleSseEvent(raw, msgEl);
      }
    }
  } catch (e) {
    msgEl.textContent += '\n[stream error: ' + e + ']';
    _streamingPaxBubble.classList.add('error');
  } finally {
    const finished = _streamingPaxBubble;
    if (finished) {
      finished.classList.remove('streaming');
      // Mark this Pax bubble as the last-completed turn so the
      // regenerate (↻) button surfaces only here.
      finished.classList.add('last-completed');
      // Attach the regenerate handler once (idempotent for re-flows).
      const btn = finished.querySelector('.regen-btn');
      if (btn && !btn.dataset.wired) {
        btn.dataset.wired = '1';
        btn.addEventListener('click', regenerateLastPax);
      }
    }
    _chatInFlight = false;
    document.body.classList.remove('in-flight');
    document.getElementById('send-btn').classList.remove('disabled');
    _streamingPaxBubble = null;
  }
}

// ---------- abort (Phase 3) ----------
async function abortChat() {
  if (!_chatInFlight) return;
  try {
    await fetch('/api/pax/chat/abort', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: '{}',
    });
  } catch (e) { /* server-side abort is source of truth; ignore network errors */ }
}

// ---------- regenerate (Phase 3) ----------
async function regenerateLastPax() {
  if (_chatInFlight || !_lastRequest) return;
  // Remove the last completed Pax bubble so the regenerated stream
  // takes its place in the transcript. The matching YOU bubble stays;
  // suppressUserEcho=true tells _streamChatMessage not to append a
  // second one (the original bug duplicated the YOU bubble on every
  // regen click).
  const last = document.querySelector('.turn.pax.last-completed');
  if (last && last.parentElement) last.parentElement.removeChild(last);
  // Re-send the same request (preserves deep flag) against the CURRENT
  // snapshot -- digest is rebuilt by the server.
  await _streamChatMessage({
    message:           _lastRequest.message,
    deep:              _lastRequest.deep,
    displayText:       _lastRequest.displayText,
    suppressUserEcho:  true,
  });
}

async function sendChat() {
  if (_chatInFlight) return;
  const ta = document.getElementById('chat-input');
  const raw = (ta.value || '').trim();
  if (!raw && !_pendingImage) return;     // allow image-only sends
  ta.value = '';                          // clear-on-send per spec
  // Slash commands intercepted client-side. /forget wipes current run's
  // history on the server AND clears the live transcript DOM. /forget
  // is checked before /deep so "/forget" never gets reinterpreted as a
  // deep prompt.
  if (raw === '/forget') {
    await runForget();
    return;
  }
  // Terminal control commands for the agent loop.
  const cmd = raw.toLowerCase();
  if (cmd === '/clear') { document.getElementById('transcript').innerHTML = ''; return; }
  if (cmd === '/start') {
    appendTermLine('[START] agent running ('+(_agentState.armed?'armed':'observe')+')', 'tk-act');
    _agentPost('/api/pax/agent/start', {armed:_agentState.armed}); return; }
  if (cmd === '/stop')  { appendTermLine('[STOP] agent stopped', 'tk-wait');
    _agentPost('/api/pax/agent/stop'); return; }
  if (cmd === '/arm')   { appendTermLine('[ARMED] sim execution ON', 'tk-short');
    _agentPost('/api/pax/agent/arm', {armed:true}); return; }
  if (cmd === '/observe' || cmd === '/disarm') {
    appendTermLine('[OBSERVE] sim execution OFF', 'tk-wait');
    _agentPost('/api/pax/agent/arm', {armed:false}); return; }
  // /deep mode: strip exactly one "/deep " prefix and flip the model
  // selector server-side. Empty after strip -> no-op (do not send).
  let deep = false;
  let msg = raw;
  if (raw.startsWith('/deep ')) {
    deep = true;
    msg = raw.slice(6).trim();
    if (!msg && !_pendingImage) return;
  }
  const img = _pendingImage;
  if (img) clearPendingImage();
  if (!msg && img) msg = 'Read / describe this image.';
  await _streamChatMessage({message: msg, deep: deep, image: img});
}

// ---------- image attachments ----------
let _pendingImage = null;   // {media_type, data (base64), dataUrl}
function clearPendingImage(){
  _pendingImage = null;
  const chip = document.getElementById('attach-chip');
  if (chip) chip.style.display = 'none';
  const fi = document.getElementById('attach-input');
  if (fi) fi.value = '';
}
function _showAttachChip(name, dataUrl){
  const chip = document.getElementById('attach-chip'); if (!chip) return;
  document.getElementById('attach-thumb').src = dataUrl;
  document.getElementById('attach-name').textContent = name || 'image attached';
  chip.style.display = 'flex';
}
function _readImageFile(file){
  if (!file || !file.type || file.type.indexOf('image/') !== 0) return;
  const fr = new FileReader();
  fr.onload = () => {
    const dataUrl = fr.result;                 // data:<type>;base64,<b64>
    const comma = String(dataUrl).indexOf(',');
    const data = comma >= 0 ? String(dataUrl).slice(comma + 1) : String(dataUrl);
    _pendingImage = {media_type: file.type, data: data, dataUrl: dataUrl};
    _showAttachChip(file.name, dataUrl);
  };
  fr.readAsDataURL(file);
}
(function wireAttach(){
  const fi = document.getElementById('attach-input');
  if (fi) fi.addEventListener('change', e => {
    if (e.target.files && e.target.files[0]) _readImageFile(e.target.files[0]);
  });
  document.addEventListener('paste', e => {
    const items = (e.clipboardData && e.clipboardData.items) || [];
    for (const it of items) {
      if (it.type && it.type.indexOf('image/') === 0) {
        const f = it.getAsFile(); if (f) { _readImageFile(f); e.preventDefault(); }
        break;
      }
    }
  });
  const inp = document.querySelector('.input');
  if (inp) {
    inp.addEventListener('dragover', e => e.preventDefault());
    inp.addEventListener('drop', e => {
      e.preventDefault();
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) _readImageFile(f);
    });
  }
})();

async function runForget() {
  try {
    const r = await fetch('/api/pax/chat/forget', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({}),
    });
    const j = await r.json();
    document.getElementById('transcript').innerHTML = '';
    showToast('history cleared (' + (j.deleted || 0) + ' rows)');
  } catch (e) {
    showToast('forget failed: ' + e);
  }
}

let _toastTimer = null;
function showToast(text) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = text;
  t.classList.add('show');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

async function loadHistory() {
  try {
    const r = await fetch('/api/pax/chat/history?limit=50&scope=all', {cache:'no-store'});
    if (!r.ok) return;
    const j = await r.json();
    const rows = j.rows || [];
    if (!rows.length) return;
    const transcript = document.getElementById('transcript');
    // Insert each historical row at the front of the transcript.
    // Rows arrive oldest-first so we just appendChild in order.
    for (const row of rows) {
      const kind = row.role === 'PAX' ? 'pax' : 'you';
      const who  = row.role === 'PAX' ? 'PAX' : 'YOU';
      const div = document.createElement('div');
      div.className = 'turn historical ' + kind;
      const whoEl = document.createElement('div');
      whoEl.className = 'who ' + kind;
      whoEl.innerHTML = '<b>' + who + '</b> &middot; ' + tsToHHMMSS(row.ts_ms);
      div.appendChild(whoEl);
      const msgEl = document.createElement('div');
      msgEl.className = 'msg';
      msgEl.dataset.rawText = row.text || '';
      msgEl.textContent = kind === 'pax' ? stripMachineBlocks(row.text || '') : (row.text || '');
      div.appendChild(msgEl);
      transcript.appendChild(div);
    }
    const divider = document.createElement('div');
    divider.className = 'hist-divider';
    divider.textContent = '— session —';
    transcript.appendChild(divider);
    // Scroll to the bottom so the divider is in view, ready for new turns.
    divider.scrollIntoView({block: 'end'});
  } catch (e) { /* history is best-effort; silent on failure */ }
}

function tsToHHMMSS(ts_ms) {
  if (!ts_ms) return '--';
  const d = new Date(Number(ts_ms));
  return d.toTimeString().slice(0,8);
}

// Clean terminal on boot: do NOT replay old chat prose into the view. The
// transcript fills with live agent ticks + new chat. History is still
// journaled (memory); /forget wipes it, /clear clears the view.
(function bootTerminal(){
  const tr = document.getElementById('transcript');
  if (tr) tr.innerHTML = '';
  appendTermLine('PAX terminal ready - /start to run agent, /arm to trade sim, /stop, /clear', 'tk-wait');
})();

function askAboutTrigger(kind, label, headline) {
  if (_chatInFlight) return;
  // Build a one-line prefilled prompt referencing the trigger. The
  // SNAPSHOT DIGEST in the system message already gives Claude the
  // full state; this prompt just tells it which trigger to focus on.
  const tag = '[WHY NOW: ' + (kind || '?') + (label ? ' · ' + label : '') + ']';
  const msg = tag + ' ' + (headline || '') + ' — quant read?';
  _streamChatMessage(msg);
}

function stripMachineBlocks(text) {
  if (!text) return '';
  return String(text)
    .replace(/<<PAX_AI_CHART_SIGNAL>>[\s\S]*?<<END>>/g, '')
    .replace(/<<PAX_FORECAST>>[\s\S]*?<<END_FORECAST>>/g, '')
    .replace(/<<PAX_AI_CHART_SIGNAL>>[\s\S]*$/g, '')
    .replace(/<<PAX_FORECAST>>[\s\S]*$/g, '')
    .replace(/\n{3,}/g, '\n\n');
}

function handleSseEvent(raw, msgEl) {
  // parse "event: name\ndata: {...}"
  let event = 'message', data = '';
  for (const line of raw.split('\n')) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trim();
  }
  let obj = {};
  try { obj = JSON.parse(data); } catch (e) { return; }
  if (event === 'token') {
    const rawText = (msgEl.dataset.rawText || '') + (obj.text || '');
    msgEl.dataset.rawText = rawText;
    msgEl.textContent = stripMachineBlocks(rawText);
    scrollBottom();
  } else if (event === 'start') {
    appendMeta(_streamingPaxBubble,
      'model=' + obj.model + ' router=' + obj.router_primary
      + (obj.snapshot_stale ? ' STALE' : ''));
  } else if (event === 'done') {
    const note = 'exit=' + obj.exit_code + ' tok=' + obj.tokens_emitted
      + ' ' + obj.elapsed_ms + 'ms'
      + (obj.aborted ? ' aborted' : '');
    appendMeta(_streamingPaxBubble, note);
    if (obj.error) {
      msgEl.textContent += '\n[' + obj.error + ']';
      _streamingPaxBubble.classList.add('error');
    }
    updateCostFooter(obj);
  } else if (event === 'error') {
    msgEl.textContent += '\n[error: ' + (obj.error || data) + ']';
    _streamingPaxBubble.classList.add('error');
  }
}

// ---------- keyboard shortcuts (Phase 3) ----------
//   Enter            -> send
//   Shift+Enter      -> newline
//   Ctrl/Cmd+Enter   -> send (alternate)
//   Esc              -> abort if in flight, else clear input
//   ArrowUp          -> recall last user prompt (only when textarea empty)
//   Ctrl/Cmd+L       -> scroll transcript to bottom
document.getElementById('chat-input').addEventListener('keydown', (e) => {
  // Ctrl/Cmd + Enter always sends (regardless of shift).
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); sendChat(); return;
  }
  // Plain Enter sends; Shift+Enter inserts a newline.
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault(); sendChat(); return;
  }
  // Esc: abort an in-flight chat, otherwise clear the input.
  if (e.key === 'Escape') {
    if (_chatInFlight) {
      e.preventDefault(); abortChat(); return;
    }
    if (e.target && typeof e.target.value === 'string' && e.target.value !== '') {
      e.preventDefault(); e.target.value = ''; return;
    }
    return;
  }
  // ArrowUp recalls the last user prompt -- only when the textarea is
  // empty so it never interferes with normal cursor navigation.
  if (e.key === 'ArrowUp' && e.target && e.target.value === '' && _lastRequest) {
    e.preventDefault();
    // Preserve a /deep prefix so the user can edit + resend in deep mode.
    e.target.value = _lastRequest.deep
      ? '/deep ' + _lastRequest.message
      : _lastRequest.message;
    return;
  }
  // Ctrl/Cmd + L scrolls the transcript to the bottom (crowded sessions).
  if ((e.ctrlKey || e.metaKey) && (e.key === 'l' || e.key === 'L')) {
    e.preventDefault();
    const wrap = document.querySelector('.transcript-wrap');
    if (wrap) wrap.scrollTop = wrap.scrollHeight;
    return;
  }
});

// ---------- voice (Web Speech API) ----------
const _SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let _recognition = null;
let _listening = false;

// Client-side normalizer (defense-in-depth; server is authoritative).
const _voiceRules = [
  [/\bin\s+queue\b/gi,     'NQ'],
  [/\bmicro\s+queue\b/gi,  'MNQ'],
  [/\bv\s*whap\b/gi,       'VWAP'],
  [/\bor\s+low\b/gi,       'OR-Low'],
  [/\bor\s+high\b/gi,      'OR-High'],
  [/\bopening\s+range\b/gi,'Opening Range'],
  [/\bplus\s+one\b/gi,     '+1'],
  [/\bplus\s+two\b/gi,     '+2'],
  [/\bplus\s+three\b/gi,   '+3'],
  [/\bminus\s+one\b/gi,    '-1'],
  [/\bminus\s+two\b/gi,    '-2'],
  [/\bminus\s+three\b/gi,  '-3'],
  [/\bbuying\s+pressure\b/gi,  'bid-side pressure'],
  [/\bselling\s+pressure\b/gi, 'ask-side pressure'],
  [/\bstop\s+sweep\b/gi,       'STOP_SWEEP'],
  [/\bice\s*berg\b/gi,         'ICEBERG'],
  [/\bfollow\s+long\b/gi,      'FOLLOW long'],
  [/\bfollow\s+short\b/gi,     'FOLLOW short'],
  [/\bfade\s+long\b/gi,        'FADE long'],
  [/\bfade\s+short\b/gi,       'FADE short'],
];
function normalizeVoice(s) {
  let out = (s || '').trim();
  for (const [re, repl] of _voiceRules) out = out.replace(re, repl);
  return out;
}

function micBtn() { return document.getElementById('mic-btn'); }
function setListeningUI(on) {
  _listening = on;
  micBtn().classList.toggle('listening', on);
  micBtn().title = on ? 'listening... (tap to stop)' : 'voice (Web Speech API)';
}

function toggleMic() {
  if (!_SR) {
    appendTurn('error', 'PAX', '[voice] SpeechRecognition not available in this WebView', false);
    return;
  }
  if (_listening) {
    try { _recognition && _recognition.stop(); } catch (e) {}
    setListeningUI(false);
    return;
  }
  _recognition = new _SR();
  _recognition.lang = 'en-US';
  _recognition.interimResults = true;
  _recognition.continuous = false;
  _recognition.maxAlternatives = 1;
  let finalText = '';
  _recognition.onresult = (ev) => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const tr = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) finalText += tr;
      else interim += tr;
    }
    const live = normalizeVoice(finalText + interim);
    document.getElementById('chat-input').value = live;
  };
  _recognition.onerror = (ev) => {
    appendTurn('error', 'PAX', '[voice] error: ' + ev.error, false);
    setListeningUI(false);
  };
  _recognition.onend = () => {
    setListeningUI(false);
    const final = normalizeVoice(finalText);
    document.getElementById('chat-input').value = final;
    // Do NOT auto-send -- user reviews then presses Enter or Send.
  };
  try {
    _recognition.start();
    setListeningUI(true);
  } catch (e) {
    appendTurn('error', 'PAX', '[voice] start failed: ' + e, false);
    setListeningUI(false);
  }
}
</script>
