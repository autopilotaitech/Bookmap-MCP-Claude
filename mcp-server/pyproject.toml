[project]
name = "bookmap-mcp"
version = "0.1.0"
description = "MCP server exposing Bookmap as tools to Claude (Desktop, Code, Cowork)."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["pytest>=9.0"]

[project.scripts]
bookmap-mcp = "bookmap_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bookmap_mcp*"]
# Backup / scratch directories must NOT be installed.
# Dotted dirs (e.g. .skip_backup_*) are already excluded by setuptools
# (Python can't import names starting with a dot), but underscore-prefixed
# patterns are kept here belt-and-suspenders for any future _backup_* layout.
exclude = [
    "bookmap_mcp._backup*",
    "bookmap_mcp.backup_*",
    "bookmap_mcp.tests*",
]

[tool.setuptools.package-data]
bookmap_mcp = ["pax_weights.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
